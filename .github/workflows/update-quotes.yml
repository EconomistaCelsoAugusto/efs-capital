name: Atualizar cotações

on:
  schedule:
    - cron: "*/15 12-22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r python-services/market-data/requirements.txt

      - name: Buscar as cotações
        run: python python-services/market-data/fetch_indices.py

      - name: Salvar e publicar, se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-indices.json
          git diff --staged --quiet || git commit -m "Atualiza cotações"
          git push